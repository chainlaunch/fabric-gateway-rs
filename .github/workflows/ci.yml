name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # build.rs compiles the vendored .proto files with tonic-build, which
      # needs both the compiler and the well-known types (google/protobuf/*)
      # that ship with libprotobuf-dev.
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Go toolchain lets the differential conformance test build the
      # fabric-gateway-go harness and run for real (instead of skipping).
      - uses: actions/setup-go@v5
        with:
          go-version-file: parity-harness/go.mod

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test (incl. differential conformance vs fabric-gateway-go)
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Security audit (RustSec advisory DB)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2025-0134: rustls-pemfile unmaintained — transitive via
          # tonic, not directly fixable, not a vulnerability. See .cargo/audit.toml.
          ignore: RUSTSEC-2025-0134
