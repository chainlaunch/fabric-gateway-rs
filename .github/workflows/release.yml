name: Release

# Publishes to crates.io when a version tag (v*) is pushed, using crates.io
# Trusted Publishing (GitHub OIDC) — no API token stored in the repo.
#
# ONE-TIME SETUP (see RELEASING.md): on crates.io, add this repo + workflow as a
# Trusted Publisher for the `fabric-gateway` crate. Until that is done this
# workflow will fail at the auth step (nothing is published).
on:
  push:
    tags: ["v*"]

permissions:
  id-token: write # required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$TAG crate=$CRATE"
          test "$TAG" = "$CRATE" || { echo "tag/version mismatch"; exit 1; }

      - name: Authenticate to crates.io (Trusted Publishing / OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
