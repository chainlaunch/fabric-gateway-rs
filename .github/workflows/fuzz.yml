name: Fuzz

# Coverage-guided fuzzing of the network-facing decoders (cargo-fuzz / libFuzzer).
# Needs nightly + a slow tool install, so it runs on a schedule and on demand
# rather than on every push. The fast, stable equivalent (src/robustness.rs) runs
# in the main CI on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        target: [proposal, envelope, error_details]
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Fuzz ${{ matrix.target }} (3 min)
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=180
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
